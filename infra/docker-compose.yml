services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ihtama-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Ihtama MCP server over stdio is run by the client (Claude Desktop);
  # for HTTP transport uncomment:
  # mcp:
  #   build: { context: .., dockerfile: infra/Dockerfile }
  #   command: ["python", "/app/services/mcp/server.py"]
  #   environment: [ "MCP_TRANSPORT=streamable-http" ]

volumes:
  ihtama-data:
